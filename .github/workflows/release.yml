name: release

# Merge-release evidence. Fires only on an annotated tag push; nothing here runs
# on ordinary commits. Re-verifies every gate, then publishes a GitHub Release
# using RELEASE-NOTES.md as the body.
#
# To cut a release (manual, deliberate):
#     git tag -a v1.0.0 -m "Agentic SDLC Pipeline v1.0.0"
#     git push origin v1.0.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[test]"

      - name: Gate 1 - tests and coverage
        run: pytest -v --cov=src/documentation_sync --cov-report=term-missing --cov-fail-under=80

      - name: Gate 2 - document quality and story parity
        run: docsync-verify . --story samples/jira_story.json

      - name: Gate 3 - required SDLC artifacts present
        run: |
          set -euo pipefail
          missing=0

          copilot_artifacts=(
            requirements.md architecture.md design-review.md impl-plan.md
            code-review.md PR.md RELEASE-NOTES.md
          )
          claude_artifacts=(
            claude-requirements.md claude-architecture.md claude-design-review.md
            claude-impl-plan.md claude-code-review.md claude-pr-description.md
            claude-verification-report.md
          )

          pipeline_complete() {
            local pipeline_name="$1"
            shift
            local artifact
            local complete=0
            for artifact in "$@"; do
              if [ ! -f "$artifact" ]; then
                echo "::notice::$pipeline_name pipeline artifact not present: $artifact"
                complete=1
              fi
            done
            return "$complete"
          }

          if pipeline_complete "Copilot" "${copilot_artifacts[@]}"; then
            echo "Copilot pipeline artifacts complete."
          elif pipeline_complete "Claude Code" "${claude_artifacts[@]}"; then
            echo "Claude Code pipeline artifacts complete."
          else
            echo "::error::A release requires one complete SDLC pipeline artifact set."
            missing=1
          fi

          [ "$missing" -eq 0 ] || exit 1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE-NOTES.md
          generate_release_notes: true
