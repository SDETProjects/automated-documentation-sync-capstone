[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-documentation-sync"
version = "0.1.0"
description = "Converts Jira-style user stories into structured requirements and synced SDLC documentation artifacts."
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
url-ingestion = ["requests>=2.31"]
mcp-tools = ["mcp>=1.0.0"]
test = ["pytest>=7", "pytest-cov>=4", "requests>=2.31", "mcp>=1.0.0"]

[project.scripts]
docsync = "documentation_sync.cli:main"
docsync-verify = "documentation_sync.doc_validator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
